# Builds the Flutter app into a signed Android APK on GitHub's servers and publishes it
# as a GitHub Release. Obtainium on the phone watches these releases and installs updates.
# Runs on every push that changes flutter_app/, or by hand from the Actions tab.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The same signing key every time, so new versions install over old ones
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=upload-keystore.p12"
          } > android/key.properties

      - run: flutter pub get

      # Each build gets a higher version (1.0.<run number>); Android only updates to a higher version
      - run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - run: cp build/app/outputs/flutter-apk/app-release.apk medical-ner.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Medical NER 1.0.${{ github.run_number }}
          body: Android app for NER in Medical Records. Install medical-ner.apk, or add this repo to Obtainium for automatic updates.
          files: flutter_app/medical-ner.apk